spring.application.name=Api_Gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# =========================================================================
# CÁCH 1: Thêm Header vào Response qua cấu hình application.properties
# Sử dụng Filter AddResponseHeader=X-System-Name, Api-Gateway-System
# =========================================================================
spring.cloud.gateway.routes[0].id=customer-service-route
#lb là load balance - tự động cân bằng tải
spring.cloud.gateway.routes[0].uri=lb://CustomerService
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[0].filters[0]=AddResponseHeader=X-System-Name, Api-Gateway-System

spring.cloud.gateway.routes[1].id=customer-service-customers-route
spring.cloud.gateway.routes[1].uri=lb://CustomerService
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/customers/**
spring.cloud.gateway.routes[1].filters[0]=AddResponseHeader=X-System-Name, Api-Gateway-System

# Spring Cloud Gateway 5 (WebFlux)
spring.cloud.gateway.server.webflux.routes[0].id=customer-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CustomerService
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AddResponseHeader=X-System-Name, Api-Gateway-System

spring.cloud.gateway.server.webflux.routes[1].id=customer-service-customers-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CustomerService
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/customers/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AddResponseHeader=X-System-Name, Api-Gateway-System
